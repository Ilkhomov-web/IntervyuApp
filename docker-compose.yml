version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: my-app-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: my_app_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./packages/server
      dockerfile: Dockerfile
    container_name: my-app-server
    restart: unless-stopped
    env_file:
      - ./packages/server/.env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
    ports:
      - "1337:1337"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./packages/server/public/uploads:/app/public/uploads

  client:
    build:
      context: ./packages/client
      dockerfile: Dockerfile
    container_name: my-app-client
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_ENDPOINT: http://localhost:1337
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  postgres_data:
