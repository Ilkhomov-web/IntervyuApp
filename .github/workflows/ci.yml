name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'packages/client/package-lock.json'
      - name: Install dependencies
        working-directory: ./packages/client
        run: npm ci
      - name: Run ESLint
        working-directory: ./packages/client
        run: npm run lint

  build-client:
    runs-on: ubuntu-latest
    needs: lint-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: ./packages/client
        run: npm ci
      - name: Build Next.js
        working-directory: ./packages/client
        run: npm run build
        env:
          NEXT_PUBLIC_API_ENDPOINT: ${{ secrets.NEXT_PUBLIC_API_ENDPOINT || 'http://localhost:1337' }}

  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: ./packages/server
        run: npm ci
      - name: Build Strapi
        working-directory: ./packages/server
        run: npm run build
